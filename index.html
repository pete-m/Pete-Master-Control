<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PMMC_v0.8.0_GOLD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { @apply bg-zinc-950 text-zinc-300 font-sans; }
        .pmmc-card { @apply bg-zinc-900 border border-zinc-800 p-6 rounded-3xl shadow-xl; }
        .pmmc-input { @apply w-full bg-white text-black p-3 rounded-xl font-mono text-xs border-2 border-transparent focus:border-orange-500 outline-none; }
        .pmmc-textarea { @apply w-full h-64 bg-white text-black p-4 rounded-2xl font-mono text-[11px] outline-none; }
        .pmmc-btn { @apply bg-orange-600 text-black font-black py-3 px-6 rounded-xl uppercase text-[10px] tracking-widest active:scale-95 transition-all; }
        
        /* The Working Log */
        details summary { @apply list-none cursor-pointer text-emerald-500 font-mono text-[10px] uppercase tracking-tighter; }
        details[open] summary { @apply mb-2 border-b border-zinc-800 pb-1; }
        .log-content { @apply max-h-32 overflow-y-auto font-mono text-[9px] text-emerald-600 space-y-1; }
        
        .asset-dot { @apply w-2 h-2 rounded-full bg-zinc-800; }
        .asset-dot.active { @apply bg-emerald-500 shadow-[0_0_8px_#10b981]; }
        .phase-locked { @apply opacity-20 pointer-events-none; }
    </style>
</head>
<body class="p-4 max-w-lg mx-auto space-y-6">

    <header class="flex justify-between items-center py-4">
        <h1 class="text-2xl font-black text-orange-600 italic uppercase tracking-tighter">PMMC v0.8.0</h1>
        <div class="flex gap-2">
            <div id="status-index" class="asset-dot"></div>
            <div id="status-code" class="asset-dot"></div>
            <div id="status-style" class="asset-dot"></div>
        </div>
    </header>

    <details class="bg-black border border-zinc-800 p-3 rounded-xl">
        <summary>► System_Logs</summary>
        <div id="UI_LOG" class="log-content">
            <div>> ENGINE_OFFLINE</div>
        </div>
    </details>

    <section class="pmmc-card space-y-4">
        <div class="flex justify-between items-center">
            <span class="text-[10px] font-black text-orange-600 uppercase italic">01 // Security & Factory</span>
        </div>
        <input type="password" id="ENTRY_TOKEN" placeholder="Paste PAT to Listen..." class="pmmc-input">
        
        <div id="FACTORY_ZONE" class="phase-locked space-y-3">
            <input type="text" id="REPO_LIST" placeholder="Repo1, Repo2, REPO_UPPER..." class="pmmc-input">
            <button onclick="window.batchInit()" class="pmmc-btn w-full">Initialise Batch</button>
        </div>
    </section>

    <section id="WORKBENCH_ZONE" class="pmmc-card phase-locked space-y-4">
        <span class="text-[10px] font-black text-zinc-500 uppercase italic">02 // Asset Preview & Commission</span>
        
        <div class="flex gap-1 overflow-x-auto pb-2 border-b border-zinc-800">
            <button onclick="window.setTab('index.html')" class="text-[10px] font-bold px-3 py-1 rounded bg-zinc-800">HTML</button>
            <button onclick="window.setTab('code.js')" class="text-[10px] font-bold px-3 py-1 rounded bg-zinc-800">JS</button>
            <button onclick="window.setTab('style.css')" class="text-[10px] font-bold px-3 py-1 rounded bg-zinc-800">CSS</button>
        </div>

        <div id="PREVIEW_HEADER" class="text-[9px] font-mono text-orange-500 uppercase">Editing: index.html</div>
        <textarea id="MAIN_TEXT" class="pmmc-textarea" placeholder="Paste asset data here..."></textarea>
        
        <div class="flex gap-2">
            <input type="text" id="TARGET_REPO" placeholder="Target Repo Name..." class="pmmc-input">
            <button onclick="window.commission()" class="pmmc-btn">Push</button>
        </div>
    </section>

    <script src="./code.js"></script>
</body>
</html>
