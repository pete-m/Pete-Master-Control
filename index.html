<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PMC v0.4.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>window.PMC_VER = "v0.4.0";</script>
</head>
<body class="bg-zinc-950 text-zinc-300 p-4 font-sans min-h-screen">
    <div class="max-w-md mx-auto space-y-3 pb-10">
        
        <header class="p-4 bg-zinc-900 border border-zinc-800 rounded-2xl flex justify-between items-center shadow-xl">
            <div>
                <h1 id="VER_ID" class="text-xl font-black text-zinc-700 uppercase italic tracking-tighter transition-colors duration-700">PMC v0.4.0</h1>
                <p class="text-[8px] text-zinc-600 uppercase tracking-[0.2em] font-bold mt-1 italic">Project: Peter Maben | Build: Gemini</p>
            </div>
            <button onclick="location.reload(true)" class="text-[9px] font-bold text-red-500 uppercase border border-red-900/30 px-3 py-1 rounded bg-red-950/10 active:bg-red-900/40">[ Hard Reload ]</button>
        </header>

        <div id="UI_LOG" class="bg-black border border-zinc-900 rounded-xl p-2 text-[10px] font-mono text-zinc-500 text-center h-24 overflow-y-auto flex flex-col-reverse shadow-inner">
            <div class="py-1 italic">[System] Initialising Core...</div>
        </div>

        <section class="p-4 bg-zinc-900 border-2 border-orange-600/20 rounded-2xl space-y-2">
            <span class="text-[9px] uppercase font-black text-orange-600 tracking-widest italic px-1">Gateway: PAT</span>
            <div class="flex gap-2">
                <input type="password" id="ENTRY_TOKEN" placeholder="Paste PAT..." class="flex-1 bg-zinc-950 border border-zinc-800 rounded-lg p-3 text-xs outline-none focus:border-orange-600 text-orange-500 font-mono">
                <button id="HANDSHAKE_BTN" class="bg-zinc-800 text-orange-500 font-black px-4 rounded-lg text-[9px] uppercase border border-zinc-700 active:bg-orange-600 active:text-white transition-all">Verify</button>
            </div>
        </section>

        <section id="PHASE_2_UI" class="space-y-2 opacity-30 pointer-events-none transition-opacity duration-500">
            <div class="pt-2 px-1 border-b border-zinc-900 pb-1 flex justify-between">
                <h2 class="text-[10px] font-black text-orange-600 uppercase tracking-widest italic">Phase 2: File Fitter</h2>
                <span class="text-[8px] text-zinc-700 font-bold uppercase italic">Buffer Active</span>
            </div>
            <input type="text" id="ENTRY_REPO" placeholder="user/repository" class="w-full bg-zinc-900 border border-zinc-800 rounded-xl p-3 text-xs outline-none text-blue-400 font-mono">
            
            <div class="grid grid-cols-5 gap-1">
                <button id="tab-index.html" class="tab-btn bg-zinc-900 border border-zinc-800 p-2 rounded-t-lg text-[7px] font-black uppercase text-zinc-500">HTML</button>
                <button id="tab-code.js" class="tab-btn bg-zinc-900 border border-zinc-800 p-2 rounded-t-lg text-[7px] font-black uppercase text-zinc-500">JS</button>
                <button id="tab-style.css" class="tab-btn bg-zinc-900 border border-zinc-800 p-2 rounded-t-lg text-[7px] font-black uppercase text-zinc-500">CSS</button>
                <button id="tab-manifest.js" class="tab-btn bg-zinc-900 border border-zinc-800 p-2 rounded-t-lg text-[7px] font-black uppercase text-zinc-500">JSON</button>
                <button id="tab-README.md" class="tab-btn bg-zinc-900 border border-zinc-800 p-2 rounded-t-lg text-[7px] font-black uppercase text-zinc-500">MD</button>
            </div>
            <textarea id="MAIN_TEXT" class="w-full h-64 bg-zinc-900 border border-zinc-800 rounded-b-xl rounded-tr-xl p-4 text-[10px] font-mono outline-none resize-none shadow-2xl" placeholder="Paste commission code here..."></textarea>
            <button id="PUSH_TRIGGER" class="w-full bg-zinc-800 border border-zinc-700 text-zinc-500 font-bold py-3 rounded-lg uppercase text-[9px] tracking-[0.2em] mt-2 active:bg-orange-600 active:text-white">Commission Batch</button>
        </section>
    </div>

    <script>
        /* PROJECT: PMC (Phase 2)
           AUTHOR: Peter Maben
           LOGIC: Unified Fitter Stabilisation
        */
        (function() {
            const buffer = { 'index.html': '', 'code.js': '', 'style.css': '', 'manifest.js': '', 'README.md': '' };
            let activeTab = 'index.html';
            let sessionPat = '';
            let userLogin = '';

            const log = (m) => {
                const el = document.getElementById('UI_LOG');
                if (el) el.innerHTML = `<div class="border-b border-zinc-900 py-1 font-mono text-[9px] uppercase tracking-tighter">${m}</div>` + el.innerHTML;
            };

            // Force engine to warm
            window.addEventListener('DOMContentLoaded', () => {
                log("<span class='text-emerald-500'>[System] Engine Warm. Handshake Ready.</span>");
            });

            // Handshake Logic
            document.getElementById('HANDSHAKE_BTN').onclick = async () => {
                const pat = document.getElementById('ENTRY_TOKEN').value.trim();
                if (!pat) return log("❌ Error: PAT Empty");

                log("📡 Querying Gateway...");
                try {
                    const r = await fetch('https://api.github.com/user', { headers: { 'Authorization': `token ${pat}` } });
                    if (r.ok) {
                        const d = await r.json();
                        sessionPat = pat;
                        userLogin = d.login;
                        log(`<span class="text-emerald-400">✅ Handshake Verified: ${d.login}</span>`);
                        document.getElementById('VER_ID').style.color = "#10b981";
                        document.getElementById('PHASE_2_UI').style.opacity = "1";
                        document.getElementById('PHASE_2_UI').style.pointerEvents = "auto";
                    } else { log(`❌ Gateway Denied: ${r.status}`); }
                } catch (e) { log("❌ Connection Refused"); }
            };

            // Tab Buffering
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.onclick = () => {
                    const area = document.getElementById('MAIN_TEXT');
                    buffer[activeTab] = area.value;
                    document.querySelectorAll('.tab-btn').forEach(b => {
                        b.style.borderColor = "#27272a";
                        b.style.color = "#52525b";
                    });
                    btn.style.borderColor = "#ea580c";
                    btn.style.color = "#ea580c";
                    activeTab = btn.id.replace('tab-', '');
                    area.value = buffer[activeTab];
                    log(`[Fitter] Focus: ${activeTab}`);
                };
            });

            // Push Batch
            document.getElementById('PUSH_TRIGGER').onclick = async () => {
                const repo = document.getElementById('ENTRY_REPO').value.trim();
                const content = document.getElementById('MAIN_TEXT').value;
                if (!repo || !content || !sessionPat) return log("⚠️ Lock: Data Missing");

                const path = repo.includes('/') ? repo : `${userLogin}/${repo}`;
                log(`[Batch] Checking ${activeTab}...`);
                try {
                    const res = await fetch(`https://api.github.com/repos/${path}/contents/${activeTab}`, {
                        headers: { 'Authorization': `token ${sessionPat}` }
                    });
                    const sha = res.ok ? (await res.json()).sha : null;
                    const push = await fetch(`https://api.github.com/repos/${path}/contents/${activeTab}`, {
                        method: 'PUT',
                        headers: { 'Authorization': `token ${sessionPat}`, 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            message: `PMC Update: ${activeTab}`,
                            content: btoa(unescape(encodeURIComponent(content))),
                            sha: sha
                        })
                    });
                    if (push.ok) log(`<span class="text-emerald-500">✨ ${activeTab} Commissioned.</span>`);
                    else log("❌ Push Failed");
                } catch (e) { log(`❌ Error: ${e.message}`); }
            };
        })();
    </script>
</body>
</html>
