<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PMC_v0.8.2.5_BASELINE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .pmc-card { @apply p-6 bg-zinc-900 border border-zinc-800 rounded-2xl mb-4 shadow-2xl; }
        .pmc-input { @apply w-full bg-white text-black p-3 rounded-lg font-mono text-sm mb-2 outline-none; }
        .pmc-btn { @apply w-full bg-orange-600 text-black font-black py-4 rounded-xl uppercase text-xs active:scale-95 transition-all; }
        .pmc-tab { @apply bg-zinc-800 px-4 py-2 rounded-t-lg text-[10px] text-zinc-500 mr-1 font-bold; }
        .pmc-tab.active { @apply bg-zinc-700 text-orange-500 border-t-2 border-orange-600; }
        .log-line { @apply p-2 font-mono text-[10px] text-emerald-500 border-b border-zinc-950 last:border-0; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-300 p-4 pb-20">

    <div class="max-w-md mx-auto">
        <div class="pmc-card">
            <span class="text-[9px] font-black text-zinc-600 uppercase mb-2 block tracking-widest">01 // IDENTITY HANDSHAKE</span>
            <input type="password" id="TOKEN" oninput="window.handshake()" placeholder="Paste PAT..." class="pmc-input text-center">
            <div id="STATUS" class="text-[10px] uppercase text-center font-black text-zinc-700 mt-1">System Offline</div>
        </div>

        <div class="pmc-card h-32 overflow-y-auto bg-black border-zinc-800 no-scrollbar">
            <div id="LOG_INNER">
                <div class="log-line text-orange-500">> PMC_BASELINE_v0.8.2.5_READY</div>
            </div>
        </div>

        <div class="pmc-card">
            <span class="text-[9px] font-black text-zinc-600 uppercase mb-2 block tracking-widest">02 // ASSET WORKBENCH</span>
            <input type="text" id="REPO" placeholder="Target Repository Name..." class="pmc-input">
            
            <div class="flex mt-4">
                <button id="tab-index.html" onclick="window.switchTab('index.html')" class="pmc-tab active">HTML</button>
                <button id="tab-code.js" onclick="window.switchTab('code.js')" class="pmc-tab">JS</button>
                <button id="tab-manifest.js" onclick="window.switchTab('manifest.js')" class="pmc-tab">JSON</button>
            </div>

            <textarea id="EDITOR" class="w-full h-96 bg-zinc-800 text-white p-4 font-mono text-[11px] rounded-b-xl outline-none border-t border-zinc-700" placeholder="Source content..."></textarea>
            
            <button onclick="window.push()" class="pmc-btn mt-4">COMMISSION ASSET</button>
            
            <div id="LINK_BOX" class="hidden mt-4 p-3 bg-black border border-zinc-800 rounded-xl text-center">
                <p class="text-[8px] text-zinc-600 font-black uppercase mb-1">Live Deployment</p>
                <a id="LIVE_LINK" href="#" target="_blank" class="text-orange-500 text-[10px] font-mono break-all underline"></a>
            </div>
        </div>
    </div>

    <script src="code.js"></script>
</body>
</html>
