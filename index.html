<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pete Master Control | Fitter v2.2</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-zinc-200 p-4 font-sans min-h-screen">
<div class="max-w-xl mx-auto space-y-4 pb-20">
    <header class="p-6 bg-zinc-900 border border-zinc-800 rounded-3xl shadow-xl text-center">
        <h1 class="text-2xl font-black tracking-tighter text-orange-500 uppercase italic">Fleet Fitter v2.2</h1>
        <p class="text-[10px] text-zinc-500 uppercase tracking-widest mt-1">Diagnostic Edition</p>
    </header>

    <div class="p-6 bg-zinc-900 border border-zinc-800 rounded-3xl space-y-3 shadow-xl">
        <input type="password" id="pat" placeholder="GitHub Token" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-3 text-xs focus:border-orange-500 outline-none">
        <input type="text" id="repo" placeholder="Target Repo (e.g., FB-Data-Porter)" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-3 text-xs focus:border-orange-500 outline-none">
    </div>

    <div class="grid grid-cols-3 gap-2">
        <button onclick="setAsset('index.html')" class="bg-zinc-800 border border-zinc-700 p-2 rounded-xl text-[10px] font-bold hover:border-blue-500">HTML</button>
        <button onclick="setAsset('code.js')" class="bg-zinc-800 border border-zinc-700 p-2 rounded-xl text-[10px] font-bold hover:border-yellow-500">SCRIPT</button>
        <button onclick="setAsset('README.md')" class="bg-zinc-800 border border-zinc-700 p-2 rounded-xl text-[10px] font-bold hover:border-green-500">README</button>
    </div>

    <input type="text" id="path" class="w-full bg-zinc-900 border border-zinc-800 rounded-xl p-3 text-xs text-orange-400 font-mono" placeholder="File Path">
    <textarea id="content" class="w-full h-80 bg-zinc-900 border border-zinc-800 rounded-3xl p-4 text-xs font-mono focus:border-orange-500 outline-none scrollbar-hide" placeholder="Paste asset content..."></textarea>

    <button onclick="pushToGitHub()" id="pushBtn" class="w-full bg-orange-600 hover:bg-orange-500 text-white font-bold py-4 rounded-3xl shadow-lg uppercase text-xs tracking-widest">Push Asset</button>
    
    <div id="statusBox" onclick="showConsole()" class="cursor-pointer group border border-dashed border-zinc-800 rounded-2xl p-4 transition-all hover:bg-zinc-900">
        <div id="log" class="text-[10px] font-mono text-zinc-500 text-center italic">Ready. Tap for console log.</div>
    </div>
</div>

<div id="consoleModal" class="hidden fixed inset-0 bg-black/90 z-50 p-6 overflow-y-auto">
    <div class="flex justify-between items-center mb-4 border-b border-zinc-800 pb-2">
        <h2 class="text-orange-500 font-bold text-xs uppercase">System Console Log</h2>
        <button onclick="hideConsole()" class="text-zinc-500 text-xs uppercase font-bold">[ Close ]</button>
    </div>
    <pre id="consoleOutput" class="text-[10px] text-zinc-400 font-mono whitespace-pre-wrap"></pre>
</div>

<script>
let lastError = "No errors logged yet.";

function setAsset(target) {
    document.getElementById('path').value = target;
    document.getElementById('content').value = ""; // Clear bug fix
    document.getElementById('log').innerText = "Targeted: " + target;
}

function showConsole() { document.getElementById('consoleModal').classList.remove('hidden'); }
function hideConsole() { document.getElementById('consoleModal').classList.add('hidden'); }

async function pushToGitHub() {
    const pat = document.getElementById('pat').value;
    const repo = document.getElementById('repo').value;
    const path = document.getElementById('path').value;
    const content = document.getElementById('content').value;
    const log = document.getElementById('log');
    const btn = document.getElementById('pushBtn');

    if (!pat || !repo || !path || !content) return alert("Missing data.");

    btn.innerText = "PUSHING...";
    btn.disabled = true;

    try {
        const url = `https://api.github.com/repos/pete-m/${repo}/contents/${path}`;
        let sha = null;
        
        const getRes = await fetch(url, { headers: { 'Authorization': `token ${pat}` } });
        if (getRes.ok) { const d = await getRes.json(); sha = d.sha; }

        const pushRes = await fetch(url, {
            method: 'PUT',
            headers: { 'Authorization': `token ${pat}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({
                message: `Update ${path}`,
                content: btoa(unescape(encodeURIComponent(content))),
                sha: sha
            })
        });

        const resultData = await pushRes.json();
        if (pushRes.ok) {
            log.innerText = "SUCCESS: " + path + " fitted.";
            log.className = "text-[10px] font-mono text-green-500 text-center font-bold italic";
        } else {
            lastError = JSON.stringify(resultData, null, 2);
            document.getElementById('consoleOutput').innerText = lastError;
            log.innerText = "ERROR: Tap to inspect payload.";
            log.className = "text-[10px] font-mono text-red-500 text-center font-bold animate-pulse";
        }
    } catch (err) {
        lastError = err.stack || err.toString();
        document.getElementById('consoleOutput').innerText = lastError;
        log.innerText = "FETCH FAILED: Tap for stack trace.";
    } finally {
        btn.innerText = "Push Asset";
        btn.disabled = false;
    }
}
</script>
</body>
</html>
