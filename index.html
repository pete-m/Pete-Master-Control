<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fleet Fitter | Master Control</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-zinc-200 p-4 font-sans min-h-screen">
<div class="max-w-xl mx-auto space-y-4">
    <header class="p-6 bg-zinc-900 border border-zinc-800 rounded-3xl shadow-xl text-center">
        <h1 class="text-2xl font-black tracking-tighter text-orange-500 uppercase">Fleet Fitter v2.0</h1>
        <p class="text-[10px] text-zinc-500 uppercase tracking-widest mt-1">Modular Asset Deployment</p>
    </header>

    <div class="p-6 bg-zinc-900 border border-zinc-800 rounded-3xl space-y-3 shadow-xl">
        <input type="password" id="pat" placeholder="GitHub Personal Access Token" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-3 text-xs focus:border-orange-500 outline-none">
        <input type="text" id="repo" placeholder="Target Repo (e.g., FB-Data-Porter)" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-3 text-xs focus:border-orange-500 outline-none">
    </div>

    <div class="grid grid-cols-3 gap-2">
        <button onclick="setAsset('index.html')" class="bg-zinc-900 border border-zinc-800 p-2 rounded-xl text-[10px] font-bold hover:border-blue-500 transition-all">HTML/CSS</button>
        <button onclick="setAsset('code.js')" class="bg-zinc-900 border border-zinc-800 p-2 rounded-xl text-[10px] font-bold hover:border-yellow-500 transition-all">SCRIPT</button>
        <button onclick="setAsset('README.md')" class="bg-zinc-900 border border-zinc-800 p-2 rounded-xl text-[10px] font-bold hover:border-green-500 transition-all">README</button>
    </div>

    <div class="relative">
        <input type="text" id="path" placeholder="File Path (e.g., index.html)" class="w-full bg-zinc-900 border border-zinc-800 rounded-xl p-3 text-xs text-orange-400 font-mono">
        <span class="absolute right-3 top-3 text-[9px] text-zinc-600 uppercase font-bold">Target Asset</span>
    </div>

    <textarea id="content" placeholder="Paste asset code here..." class="w-full h-80 bg-zinc-900 border border-zinc-800 rounded-3xl p-4 text-xs font-mono focus:border-orange-500 outline-none scrollbar-hide"></textarea>

    <button onclick="pushToGitHub()" id="pushBtn" class="w-full bg-orange-600 hover:bg-orange-500 text-white font-bold py-4 rounded-3xl shadow-lg transition-all uppercase tracking-widest text-xs">Push Asset to Fleet</button>
    
    <div id="log" class="text-[10px] font-mono text-zinc-500 text-center italic py-2">System Ready for Modular Push.</div>
</div>

<script>
function setAsset(target) {
    document.getElementById('path').value = target;
    const log = document.getElementById('log');
    log.innerText = "Targeted: " + target;
    log.className = "text-[10px] font-mono text-blue-400 text-center italic py-2";
}

async function pushToGitHub() {
    const pat = document.getElementById('pat').value;
    const repo = document.getElementById('repo').value;
    const path = document.getElementById('path').value;
    const content = document.getElementById('content').value;
    const log = document.getElementById('log');
    const btn = document.getElementById('pushBtn');

    if (!pat || !repo || !path || !content) return alert("All fields required.");

    btn.innerText = "DEPLOYING...";
    btn.disabled = true;

    try {
        const url = `https://api.github.com/repos/pete-m/${repo}/contents/${path}`;
        
        // 1. Get existing file (to get SHA if it exists)
        let sha = null;
        const getRes = await fetch(url, {
            headers: { 'Authorization': `token ${pat}` }
        });
        if (getRes.ok) {
            const getData = await getRes.json();
            sha = getData.sha;
        }

        // 2. Push Update
        const pushRes = await fetch(url, {
            method: 'PUT',
            headers: {
                'Authorization': `token ${pat}`,
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({
                message: `Modular fitting: ${path}`,
                content: btoa(unescape(encodeURIComponent(content))),
                sha: sha
            })
        });

        if (pushRes.ok) {
            log.innerText = "SUCCESS: " + path + " fitted to " + repo;
            log.className = "text-[10px] font-mono text-green-500 text-center font-bold py-2";
        } else {
            throw new Error(await pushRes.text());
        }
    } catch (err) {
        log.innerText = "ERROR: See Console.";
        console.error(err);
    } finally {
        btn.innerText = "Push Asset to Fleet";
        btn.disabled = false;
    }
}
</script>
</body>
</html>
