<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PMC v3.8</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
    .active-tab { border-color: #ea580c !important; color: #ea580c !important; background: #1c1c1f !important; }
    .staged { color: #ea580c !important; border-color: #ea580c !important; opacity: 1 !important; border-style: solid !important; }
    .valid-token { color: #22c55e !important; }
    .invalid-token { color: #ef4444 !important; }
    textarea { scrollbar-width: thin; scrollbar-color: #3f3f46 transparent; }
</style>
</head>
<body class="bg-zinc-950 text-zinc-300 p-4 font-sans min-h-screen">

<div class="max-w-md mx-auto space-y-3 pb-10">
    <header class="p-4 bg-zinc-900 border border-zinc-800 rounded-2xl flex justify-between items-center shadow-xl">
        <div>
            <h1 class="text-xl font-black text-orange-600 uppercase italic tracking-tighter leading-none">PMC v3.8</h1>
            <p id="AUTH_STAT" class="text-[8px] text-zinc-600 uppercase tracking-[0.2em] font-bold mt-1">Standby...</p>
        </div>
        <button onclick="hardReset()" class="text-[9px] font-bold text-red-500/40 uppercase hover:text-red-500">[ Wipe ]</button>
    </header>

    <div id="UI_LOG" class="bg-zinc-950 border border-zinc-900 rounded-xl p-2 text-[10px] font-mono text-zinc-500 text-center italic shadow-inner">
        Ready for assignment.
    </div>

    <section class="p-4 bg-zinc-900 border-2 border-orange-600/20 rounded-2xl space-y-2 shadow-2xl">
        <div class="flex justify-between items-center px-1">
            <span class="text-[9px] uppercase font-black text-orange-600 tracking-widest italic">Gateway: Mandatory PAT</span>
        </div>
        <input type="password" id="ENTRY_TOKEN" placeholder="Paste GitHub PAT here..." class="w-full bg-zinc-950 border border-zinc-800 rounded-lg p-3 text-xs outline-none focus:border-orange-600 shadow-inner" onchange="validateToken()">
    </section>

    <section class="p-4 bg-zinc-900 border border-zinc-800 rounded-2xl space-y-3 shadow-xl opacity-80 focus-within:opacity-100 transition-opacity">
        <div class="flex justify-between items-center px-1">
            <span class="text-[9px] uppercase font-black text-zinc-600 tracking-widest italic">Phase 1: New Infrastructure</span>
        </div>
        <div class="flex gap-2">
            <input type="text" id="INIT_REPO_NAME" placeholder="New Repo Name" class="flex-1 bg-zinc-950 border border-zinc-800 rounded-lg p-3 text-xs outline-none text-blue-400 font-mono" oninput="saveCreds()">
            <button onclick="fullSystemInit()" class="bg-orange-600 text-white font-black px-5 rounded-lg text-[9px] uppercase active:scale-95 transition-all">Init Repo</button>
        </div>
    </section>

    <div class="pt-2 px-1 flex justify-between items-end border-b border-zinc-900 pb-1">
        <h2 class="text-[10px] font-black text-orange-600 uppercase tracking-widest italic">Phase 2: File Fitter</h2>
        <span class="text-[7px] text-zinc-600 uppercase font-bold tracking-tighter">Asset Staging</span>
    </div>

    <section class="space-y-2">
        <input type="text" id="ENTRY_REPO" placeholder="Target Repository Name" class="w-full bg-zinc-900 border border-zinc-800 rounded-xl p-3 text-xs outline-none text-blue-400 font-mono shadow-xl focus:border-orange-600 transition-all" oninput="saveCreds()">

        <div class="grid grid-cols-3 gap-1">
            <button id="tab-index.html" onclick="switchBuffer('index.html')" class="bg-zinc-900 border border-zinc-800 p-2 rounded-lg text-[8px] font-black uppercase transition-all">HTML</button>
            <button id="tab-code.js" onclick="switchBuffer('code.js')" class="bg-zinc-900 border border-zinc-800 p-2 rounded-lg text-[8px] font-black uppercase transition-all">Script</button>
            <button id="tab-README.md" onclick="switchBuffer('README.md')" class="bg-zinc-900 border border-zinc-800 p-2 rounded-lg text-[8px] font-black uppercase transition-all">ReadMe</button>
        </div>

        <div class="relative">
            <textarea id="MAIN_TEXT" oninput="updateBufferMemory()" class="w-full h-40 bg-zinc-900 border border-zinc-800 rounded-xl p-4 text-[10px] font-mono focus:border-orange-600 outline-none shadow-inner leading-relaxed resize-none" placeholder="Paste asset code..."></textarea>
            <button onclick="clearCurrentBuffer()" class="absolute bottom-2 right-2 text-red-500/30 hover:text-red-500 text-[8px] font-bold uppercase tracking-tighter">[ Clear ]</button>
        </div>

        <div class="p-3 bg-zinc-900 border border-zinc-800 rounded-xl space-y-3 shadow-xl">
            <div id="STAGING_BAR" class="flex justify-center gap-3">
                <div id="status-index.html" class="border border-dashed border-zinc-800 px-2 py-0.5 rounded text-[7px] font-bold opacity-30">HTML</div>
                <div id="status-code.js" class="border border-dashed border-zinc-800 px-2 py-0.5 rounded text-[7px] font-bold opacity-30">SCRIPT</div>
                <div id="status-README.md" class="border border-dashed border-zinc-800 px-2 py-0.5 rounded text-[7px] font-bold opacity-30">README</div>
            </div>
            
            <button id="PUSH_TRIGGER" onclick="executeBatchDeployment()" class="w-full bg-zinc-800 border border-zinc-700 text-zinc-400 font-bold py-3 rounded-lg uppercase text-[9px] tracking-[0.2em] transition-all hover:bg-zinc-700 hover:text-white">Commission Assets</button>
        </div>
    </section>
</div>

<script>
let currentPath = 'index.html';
let buffers = { 'index.html': '', 'code.js': '', 'README.md': '' };

const WORKFLOWS = {
    static: `name: deploy_static\non: [push, workflow_dispatch]\npermissions: { contents: read, pages: write, id-token: write }\njobs:\n  deploy:\n    environment: { name: github-pages }\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/configure-pages@v5\n      - uses: actions/upload-pages-artifact@v3\n        with: { path: '.' }\n      - uses: actions/deploy-pages@v4`,
    clearout: `name: clear_out\non: [workflow_dispatch]\njobs:\n  clear:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v2\n      - run: |\n          git config user.email "action@github.com"\n          git config user.name "Pete-Bot"\n          git checkout --orphan temp\n          git add -A\n          git commit -m "Clean Slate"\n          git branch -D main\n          git branch -m main\n          git push -f origin main`
};

window.onload = () => {
    document.getElementById('ENTRY_TOKEN').value = localStorage.getItem('pmc_token') || '';
    document.getElementById('ENTRY_REPO').value = localStorage.getItem('pmc_repo') || '';
    document.getElementById('INIT_REPO_NAME').value = localStorage.getItem('pmc_init_repo') || '';
    if(document.getElementById('ENTRY_TOKEN').value) validateToken();
    switchBuffer('index.html');
};

async function validateToken() {
    const token = document.getElementById('ENTRY_TOKEN').value;
    const stat = document.getElementById('AUTH_STAT');
    saveCreds();
    if(!token) return;
    stat.innerText = "CHECKING GATEWAY...";
    try {
        const r = await fetch('https://api.github.com/user', { headers: {'Authorization':`token ${token}`} });
        if(r.ok) {
            stat.innerText = "GATEWAY: OPEN";
            stat.className = "text-[8px] uppercase tracking-[0.2em] font-black valid-token";
        } else {
            stat.innerText = "GATEWAY: CLOSED";
            stat.className = "text-[8px] uppercase tracking-[0.2em] font-black invalid-token";
        }
    } catch(e) { stat.innerText = "GATEWAY: ERROR"; }
}

function saveCreds() {
    localStorage.setItem('pmc_token', document.getElementById('ENTRY_TOKEN').value);
    localStorage.setItem('pmc_repo', document.getElementById('ENTRY_REPO').value);
    localStorage.setItem('pmc_init_repo', document.getElementById('INIT_REPO_NAME').value);
}

function switchBuffer(newPath) {
    // BUG FIX: Store the current text into the current buffer BEFORE switching the path
    buffers[currentPath] = document.getElementById('MAIN_TEXT').value;
    
    // Now switch the path
    currentPath = newPath;
    
    // Load the text from the new path's buffer
    document.getElementById('MAIN_TEXT').value = buffers[newPath] || '';
    
    // Update UI
    document.querySelectorAll('[id^="tab-"]').forEach(btn => btn.classList.remove('active-tab'));
    document.getElementById(`tab-${newPath}`).classList.add('active-tab');
    updateStagingIcons();
}

function updateBufferMemory() {
    buffers[currentPath] = document.getElementById('MAIN_TEXT').value;
    updateStagingIcons();
}

function updateStagingIcons() {
    Object.keys(buffers).forEach(key => {
        const el = document.getElementById(`status-${key}`);
        stat.className = "text-[8px] uppercase tracking-[0.2em] font-black invalid-token";
    }
}

function saveCreds() {
    localStorage.setItem('pmc_token', document.getElementById('ENTRY_TOKEN').value);
    localStorage.setItem('pmc_repo', document.getElementById('ENTRY_REPO').value);
    localStorage.setItem('pmc_init_repo', document.getElementById('INIT_REPO_NAME').value);
}

function updateLog(msg) {
    document.getElementById('UI_LOG').innerText = msg;
}

async function fullSystemInit() {
    const pat = document.getElementById('ENTRY_TOKEN').value;
    const name = document.getElementById('INIT_REPO_NAME').value;
    if(!pat || !name) return alert("Initialization requires Token and New Repo Name.");
    
    updateLog("Phase 1: Creating Repo...");
    try {
        const res = await fetch('https://api.github.com/user/repos', {
            method: 'POST',
            headers: {'Authorization': `token ${pat}`, 'Content-Type': 'application/json'},
            body: JSON.stringify({ name: name, auto_init: true })
    localStorage.setItem('pmc_token', document.getElementById('ENTRY_TOKEN').value);
    localStorage.setItem('pmc_repo', document.getElementById('ENTRY_REPO').value);
}

function updateLog(msg) {
    document.getElementById('UI_LOG').innerText = msg;
}

async function fullSystemInit() {
    const pat = document.getElementById('ENTRY_TOKEN').value;
    const name = document.getElementById('ENTRY_REPO').value;
    if(!pat || !name) return alert("Credentials Missing.");
    
    updateLog("Phase 1: Creating Repo...");
    try {
        const res = await fetch('https://api.github.com/user/repos', {
            method: 'POST',
            headers: {'Authorization': `token ${pat}`, 'Content-Type': 'application/json'},
            body: JSON.stringify({ name: name, auto_init: true })
        });

        if(res.ok) {
            updateLog("Success. Injecting Workflows...");
            setTimeout(async () => {
                await pushFile(pat, name, '.github/workflows/static.yml', WORKFLOWS.static);
                await pushFile(pat, name, '.github/workflows/clear_out.yml', WORKFLOWS.clearout);
                updateLog("Infrastructure Live.");
            }, 3000);
        } else { updateLog("Init Failed (Check scope/name)."); }
    } catch(e) { updateLog("Connection Error."); }
}

function switchBuffer(path) {
    buffers[currentPath] = document.getElementById('MAIN_TEXT').value;
    currentPath = path;
    document.getElementById('MAIN_TEXT').value = buffers[path];
    document.querySelectorAll('[id^="tab-"]').forEach(btn => btn.classList.remove('active-tab'));
    document.getElementById(`tab-${path}`).classList.add('active-tab');
    updateStagingIcons();
}

function updateBufferMemory() {
    buffers[currentPath] = document.getElementById('MAIN_TEXT').value;
    updateStagingIcons();
}

function updateStagingIcons() {
    Object.keys(buffers).forEach(key => {
        const el = document.getElementById(`status-${key}`);
        if(buffers[key].trim().length > 0) el.classList.add('staged');
        else el.classList.remove('staged');
    });
}

async function executeBatchDeployment() {
    const pat = document.getElementById('ENTRY_TOKEN').value;
    const repo = document.getElementById('ENTRY_REPO').value;
    const files = Object.keys(buffers).filter(k => buffers[k].trim().length > 0);
    if(files.length === 0) return alert("Nothing staged.");

    updateLog("Pushing assets...");
    for (const file of files) { await pushFile(pat, repo, file, buffers[file]); }
    updateLog("Assets Commissioned.");
}

async function pushFile(pat, repo, path, content) {
    const url = `https://api.github.com/repos/pete-m/${repo}/contents/${path}`;
    let sha = null;
    const g = await fetch(url, {headers:{'Authorization':`token ${pat}`}});
    if(g.ok) { const d = await g.json(); sha = d.sha; }

    return fetch(url, {
        method: 'PUT',
        headers: {'Authorization':`token ${pat}`,'Content-Type':'application/json'},
        body: JSON.stringify({
            message: "PMC v3.5 Update",
            content: btoa(unescape(encodeURIComponent(content))),
            sha: sha
        })
    });
}

function clearCurrentBuffer() {
    document.getElementById('MAIN_TEXT').value = '';
    buffers[currentPath] = '';
    updateStagingIcons();
}

function hardReset() {
    if(confirm("Purge Local Cache?")) { 
        localStorage.clear(); location.reload(); }
}

window.onload = () => {
    document.getElementById('ENTRY_TOKEN').value = localStorage.getItem('pmc_token') || '';
    document.getElementById('ENTRY_REPO').value = localStorage.getItem('pmc_repo') || '';
    if(document.getElementById('ENTRY_TOKEN').value) validateToken();
    switchBuffer('index.html');
};

async function validateToken() {
    saveCreds();
    const token = document.getElementById('ENTRY_TOKEN').value;
    const stat = document.getElementById('AUTH_STAT');
    if(!token) return;
    try {
        const r = await fetch('https://api.github.com/user', { headers: {'Authorization':`token ${token}`} });
        if(r.ok) {
            stat.innerText = "AUTH: VALIDATED";
            stat.className = "text-[8px] uppercase tracking-[0.2em] font-black valid-token";
        } else {
            stat.innerText = "AUTH: INVALID";
            stat.className = "text-[8px] uppercase tracking-[0.2em] font-black invalid-token";
        }
    } catch(e) { stat.innerText = "AUTH: OFFLINE"; }
}

function saveCreds() {
    localStorage.setItem('pmc_token', document.getElementById('ENTRY_TOKEN').value);
    localStorage.setItem('pmc_repo', document.getElementById('ENTRY_REPO').value);
}

async function fullSystemInit() {
    const pat = document.getElementById('ENTRY_TOKEN').value;
    const name = document.getElementById('ENTRY_REPO').value;
    const log = document.getElementById('UI_LOG');
    const btn = document.getElementById('CREATE_BTN');

    if(!pat || !name) return alert("Credentials Missing.");
    
    btn.disabled = true;
    log.innerText = "Creating repository...";

    try {
        const res = await fetch('https://api.github.com/user/repos', {
            method: 'POST',
            headers: {'Authorization': `token ${pat}`, 'Content-Type': 'application/json'},
            body: JSON.stringify({ name: name, auto_init: true })
        });

        if(res.ok) {
            log.innerText = "Repo online. Injecting System Workflows...";
            // Delay to ensure GitHub API catches up
            setTimeout(async () => {
                await pushFile(pat, name, '.github/workflows/static.yml', WORKFLOWS.static);
                await pushFile(pat, name, '.github/workflows/clear_out.yml', WORKFLOWS.clearout);
                log.innerText = "SUCCESS: Infrastructure, Static Deploy, and ClearOut active.";
                btn.disabled = false;
            }, 3000);
        } else {
            log.innerText = "FAILED: Check name or token permissions.";
            btn.disabled = false;
        }
    } catch(e) { log.innerText = "CRITICAL: " + e.message; btn.disabled = false; }
}

    buffers[currentPath] = document.getElementById('MAIN_TEXT').value;
    currentPath = path;
    document.getElementById('MAIN_TEXT').value = buffers[path];

}
