<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PMC_v0.8.1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .pmc-container { @apply max-w-md mx-auto space-y-4 pb-20; }
        .pmc-card { @apply p-6 bg-zinc-900 border border-zinc-800 rounded-[2rem] shadow-2xl; }
        .pmc-header { @apply p-8 bg-zinc-900 border-b border-zinc-800 flex justify-between items-center rounded-b-[2rem]; }
        
        /* Log Narrative Engine */
        .log-shell { @apply mx-4 bg-black border border-zinc-800 rounded-xl overflow-hidden transition-all duration-300 cursor-pointer; }
        .log-shell.open { @apply h-40 overflow-y-auto; }
        .log-shell.shut { @apply h-10; }
        .log-line { @apply p-2 font-mono text-[10px] uppercase text-emerald-500 border-b border-zinc-900 last:border-0; }

        /* Maintenance Layer */
        #MAINT_MODAL { @apply fixed inset-0 bg-black/95 backdrop-blur-md z-50 hidden flex-col items-center justify-center p-8; }
        
        .pmc-input { @apply w-full bg-black border border-zinc-800 rounded-xl p-4 text-xs text-orange-500 font-mono outline-none focus:border-orange-600 transition-all; }
        .pmc-textarea { @apply w-full h-80 bg-zinc-950 border border-zinc-800 rounded-3xl p-5 text-[11px] font-mono outline-none resize-none transition-all; }
        .pmc-textarea.lit { @apply border-emerald-500 shadow-[0_0_25px_rgba(16,185,129,0.3)]; }

        .pmc-btn-main { @apply w-full bg-orange-600 text-black font-black py-5 rounded-2xl uppercase text-[10px] tracking-widest active:scale-95 transition-all shadow-xl; }
        .pmc-tab { @apply bg-zinc-950 border border-zinc-800 px-4 py-2 rounded-t-xl text-[10px] font-black uppercase text-zinc-600; }
        .pmc-tab.active { @apply border-t-orange-600 text-orange-500 bg-zinc-900; }
        
        .pmc-dot { @apply w-2.5 h-2.5 rounded-full bg-zinc-800 transition-all; }
        .pmc-dot.on { @apply bg-emerald-500 shadow-[0_0_10px_#10b981]; }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-300 font-sans p-0">

    <div id="MAINT_MODAL">
        <div class="pmc-card w-full max-w-xs space-y-4 border-orange-600/40">
            <h3 class="text-orange-500 font-black uppercase italic tracking-[0.2em] text-center text-[10px] mb-4">System Maintenance</h3>
            <button onclick="window.invokeYAML()" class="w-full bg-blue-600 text-white font-black py-4 rounded-xl uppercase text-[10px] tracking-widest shadow-lg active:scale-95 transition-all">Invoke YAML Actions</button>
            <div class="grid grid-cols-1 gap-2">
                <button onclick="window.clearRepos()" class="w-full bg-zinc-800 text-orange-500 font-bold py-3 rounded-lg uppercase text-[9px] border border-zinc-700">Clear Repos List</button>
                <button onclick="window.clearCommits()" class="w-full bg-zinc-800 text-red-500 font-bold py-3 rounded-lg uppercase text-[9px] border border-zinc-700">Clear Commits</button>
            </div>
            <button onclick="document.getElementById('MAINT_MODAL').style.display='none'" class="w-full text-[10px] text-zinc-600 uppercase font-black py-4">Close Console</button>
        </div>
    </div>

    <div class="pmc-container">
        <header class="pmc-header">
            <div>
                <h1 class="text-xl font-black text-orange-600 italic tracking-tighter uppercase">PMC v0.8.1</h1>
                <p class="text-[9px] text-zinc-600 font-bold uppercase tracking-[0.3em]">Ops Engine</p>
            </div>
            <button onclick="document.getElementById('MAINT_MODAL').style.display='flex'" class="text-[10px] font-black text-zinc-500 border border-zinc-800 px-4 py-1.5 rounded-full">MAINT</button>
        </header>

        <div id="LOG_SHELL" onclick="window.toggleLog()" class="log-shell shut">
            <div id="UI_LOG">
                <div class="log-line text-orange-500">[System] v0.8.1 Standby...</div>
            </div>
        </div>

        <div class="px-4 space-y-4">
            <section class="pmc-card">
                <span class="text-[10px] font-black text-orange-600 uppercase mb-2 block italic">01 // Auth Handshake</span>
                <input type="password" id="ENTRY_TOKEN" oninput="window.silentHandshake()" placeholder="••••••••••••" class="pmc-input">
            </section>

            <section id="PHASE_1_UI" class="pmc-card opacity-30 pointer-events-none transition-all duration-700">
                <span class="text-[10px] font-black text-zinc-500 uppercase mb-2 block italic">02 // Repo Anchor</span>
                <div class="flex gap-2">
                    <input type="text" id="INIT_REPO_NAME" placeholder="Repo Name..." class="pmc-input">
                    <button onclick="window.runInit()" class="bg-zinc-800 text-white font-black px-6 rounded-xl text-[10px] uppercase">Init</button>
                </div>
            </section>

            <section id="PHASE_2_UI" class="space-y-3 opacity-30 pointer-events-none transition-all duration-700">
                <div class="flex justify-between items-end border-b border-zinc-900 pb-2">
                    <h2 class="text-[11px] font-black text-orange-600 uppercase italic">03 // Asset Fitter</h2>
                    <div class="flex gap-2">
                        <div id="stat-index.html" class="pmc-dot"></div>
                        <div id="stat-code.js" class="pmc-dot"></div>
                        <div id="stat-style.css" class="pmc-dot"></div>
                        <div id="stat-manifest.js" class="pmc-dot"></div>
                        <div id="stat-README.md" class="pmc-dot"></div>
                    </div>
                </div>

                <div class="flex gap-1 overflow-x-auto no-scrollbar">
                    <button id="tab-index.html" onclick="window.switchTab('tab-index.html')" class="pmc-tab active">HTML</button>
                    <button id="tab-code.js" onclick="window.switchTab('tab-code.js')" class="pmc-tab">JS</button>
                    <button id="tab-style.css" onclick="window.switchTab('tab-style.css')" class="pmc-tab">CSS</button>
                    <button id="tab-manifest.js" onclick="window.switchTab('tab-manifest.js')" class="pmc-tab">JSON</button>
                    <button id="tab-README.md" onclick="window.switchTab('tab-README.md')" class="pmc-tab">MD</button>
                </div>

                <div class="relative">
                    <button onclick="window.purgeTab()" class="absolute top-[-30px] right-0 text-[9px] font-black text-zinc-700 uppercase">[ Purge ]</button>
                    <textarea id="MAIN_TEXT" class="pmc-textarea" placeholder="Paste asset data..."></textarea>
                </div>

                <button onclick="window.runPush()" class="pmc-btn-main shadow-[0_0_20px_rgba(234,88,12,0.15)]">Commission Asset</button>
            </section>
        </div>
    </div>

    <script>
        window.addEventListener('load', () => {
            const v = "0.8.1";
            fetch('./code.js?v=' + v + '&t=' + Date.now()).then(r => r.text()).then(c => {
                const s = document.createElement('script');
                s.textContent = c;
                document.body.appendChild(s);
            });
        });
    </script>
</body>
</html>
</html>
