<!DOCTYPE html>
<html lang="en-GB">
<head>
    
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PMC v3.3 | Zero-Touch</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
    .active-tab { border-color: #ea580c !important; color: #ea580c !important; background: #1c1c1f !important; }
    .staged { color: #ea580c !important; border-color: #ea580c !important; opacity: 1 !important; border-style: solid !important; }
    .valid-token { color: #22c55e !important; }
    .invalid-token { color: #ef4444 !important; }
    textarea { scrollbar-width: thin; scrollbar-color: #3f3f46 transparent; }
</style>
</head>
<body class="bg-zinc-950 text-zinc-300 p-4 font-sans min-h-screen">

<div class="max-w-md mx-auto space-y-4 pb-20">
    <header class="p-4 bg-zinc-900 border border-zinc-800 rounded-2xl flex justify-between items-center shadow-xl">
        <div>
            <h1 class="text-xl font-black text-orange-600 uppercase italic tracking-tighter">PMC v3.3</h1>
            <p id="AUTH_STAT" class="text-[8px] text-zinc-600 uppercase tracking-[0.2em] font-bold">Checking Auth...</p>
        </div>
        <button onclick="hardReset()" class="text-[9px] font-bold text-red-500/40 uppercase hover:text-red-500 transition-colors">[ Wipe Cache ]</button>
    </header>

    <section class="p-5 bg-zinc-900 border border-zinc-800 rounded-3xl space-y-3 shadow-2xl border-t-orange-600/20">
        <div class="flex justify-between items-center px-1">
            <span class="text-[9px] uppercase font-black text-zinc-500 tracking-widest">Phase 1: Zero-Touch Init</span>
        </div>
        <input type="password" id="ENTRY_TOKEN" placeholder="GitHub Token" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-3 text-xs outline-none focus:border-orange-600" oninput="validateToken()">
        <input type="text" id="ENTRY_REPO" placeholder="New Repo Name" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-3 text-xs outline-none text-blue-400 font-mono" oninput="saveCreds()">
        
        <button id="CREATE_BTN" onclick="fullSystemInit()" class="w-full bg-orange-600 text-white font-black py-4 rounded-xl text-[10px] uppercase shadow-lg shadow-orange-900/20 active:scale-95 transition-all">Initialize + Deploy Actions</button>
    </section>

    <section class="space-y-3">
        <div class="flex justify-between items-center px-1">
            <span class="text-[9px] uppercase font-black text-zinc-500 tracking-widest">Phase 2: Content Fitter</span>
        </div>
        
        <div class="grid grid-cols-3 gap-1">
            <button id="tab-index.html" onclick="switchBuffer('index.html')" class="bg-zinc-900 border border-zinc-800 p-2 rounded-lg text-[8px] font-black uppercase transition-all">HTML</button>
            <button id="tab-code.js" onclick="switchBuffer('code.js')" class="bg-zinc-900 border border-zinc-800 p-2 rounded-lg text-[8px] font-black uppercase transition-all">Script</button>
            <button id="tab-README.md" onclick="switchBuffer('README.md')" class="bg-zinc-900 border border-zinc-800 p-2 rounded-lg text-[8px] font-black uppercase transition-all">ReadMe</button>
        </div>

        <div class="relative">
            <textarea id="MAIN_TEXT" oninput="updateBufferMemory()" class="w-full h-64 bg-zinc-900 border border-zinc-800 rounded-2xl p-4 text-[10px] font-mono focus:border-orange-600 outline-none shadow-inner leading-relaxed resize-none" placeholder="Paste asset code here..."></textarea>
            <button onclick="clearCurrentBuffer()" class="absolute bottom-3 right-3 text-red-500/30 hover:text-red-500 text-[8px] font-bold uppercase tracking-tighter">[ Purge Text ]</button>
        </div>

        <div class="p-4 bg-zinc-900 border border-zinc-800 rounded-2xl space-y-4 shadow-xl">
            <div id="STAGING_BAR" class="flex justify-center gap-3">
                <div id="status-index.html" class="border border-dashed border-zinc-800 px-3 py-1 rounded text-[7px] font-bold opacity-30">HTML</div>
                <div id="status-code.js" class="border border-dashed border-zinc-800 px-3 py-1 rounded text-[7px] font-bold opacity-30">SCRIPT</div>
                <div id="status-README.md" class="border border-dashed border-zinc-800 px-3 py-1 rounded text-[7px] font-bold opacity-30">README</div>
            </div>
            
            <button id="PUSH_TRIGGER" onclick="executeBatchDeployment()" class="w-full bg-zinc-800 border border-zinc-700 text-zinc-300 font-black py-4 rounded-xl uppercase text-[10px] tracking-[0.2em] transition-all hover:bg-zinc-700">Commission Assets</button>
        </div>
    </section>

    <div id="UI_LOG" class="border border-zinc-900 rounded-xl p-3 text-[9px] font-mono text-zinc-500 text-center italic">
        Standing by for infrastructure.
    </div>
</div>

<script>
let currentPath = 'index.html';
let buffers = { 'index.html': '', 'code.js': '', 'README.md': '' };

// Pre-defined workflows for one-tap deployment
const WORKFLOWS = {
    static: `name: deploy_static
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    environment:
      name: github-pages
      url: \${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4`,
    
    clearout: `name: clear_out
on:
  workflow_dispatch:
jobs:
  clear-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Clear History
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git checkout --orphan temp_branch
          git add -A
          git commit -m "Clean Slate"
          git branch -D main
          git branch -m main
          git push -f origin main`
};

window.onload = () => {
    document.getElementById('ENTRY_TOKEN').value = localStorage.getItem('pmc_token') || '';
    document.getElementById('ENTRY_REPO').value = localStorage.getItem('pmc_repo') || '';
    if(document.getElementById('ENTRY_TOKEN').value) validateToken();
    switchBuffer('index.html');
};

async function validateToken() {
    saveCreds();
    const token = document.getElementById('ENTRY_TOKEN').value;
    const stat = document.getElementById('AUTH_STAT');
    if(!token) return;
    try {
        const r = await fetch('https://api.github.com/user', { headers: {'Authorization':`token ${token}`} });
        if(r.ok) {
            stat.innerText = "AUTH: VALIDATED";
            stat.className = "text-[8px] uppercase tracking-[0.2em] font-black valid-token";
        } else {
            stat.innerText = "AUTH: INVALID";
            stat.className = "text-[8px] uppercase tracking-[0.2em] font-black invalid-token";
        }
    } catch(e) { stat.innerText = "AUTH: OFFLINE"; }
}

function saveCreds() {
    localStorage.setItem('pmc_token', document.getElementById('ENTRY_TOKEN').value);
    localStorage.setItem('pmc_repo', document.getElementById('ENTRY_REPO').value);
}

async function fullSystemInit() {
    const pat = document.getElementById('ENTRY_TOKEN').value;
    const name = document.getElementById('ENTRY_REPO').value;
    const log = document.getElementById('UI_LOG');
    const btn = document.getElementById('CREATE_BTN');

    if(!pat || !name) return alert("Credentials Missing.");
    
    btn.disabled = true;
    log.innerText = "Creating repository...";

    try {
        const res = await fetch('https://api.github.com/user/repos', {
            method: 'POST',
            headers: {'Authorization': `token ${pat}`, 'Content-Type': 'application/json'},
            body: JSON.stringify({ name: name, auto_init: true })
        });

        if(res.ok) {
            log.innerText = "Repo online. Injecting System Workflows...";
            // Delay to ensure GitHub API catches up
            setTimeout(async () => {
                await pushFile(pat, name, '.github/workflows/static.yml', WORKFLOWS.static);
                await pushFile(pat, name, '.github/workflows/clear_out.yml', WORKFLOWS.clearout);
                log.innerText = "SUCCESS: Infrastructure, Static Deploy, and ClearOut active.";
                btn.disabled = false;
            }, 3000);
        } else {
            log.innerText = "FAILED: Check name or token permissions.";
            btn.disabled = false;
        }
    } catch(e) { log.innerText = "CRITICAL: " + e.message; btn.disabled = false; }
}

function switchBuffer(path) {
    buffers[currentPath] = document.getElementById('MAIN_TEXT').value;
    currentPath = path;
    document.getElementById('MAIN_TEXT').value = buffers[path];
    document.querySelectorAll('[id^="tab-"]').forEach(btn => btn.classList.remove('active-tab'));
    document.getElementById(`tab-${path}`).classList.add('active-tab');
    updateStagingIcons();
}

function updateBufferMemory() {
    buffers[currentPath] = document.getElementById('MAIN_TEXT').value;
    updateStagingIcons();
}

function updateStagingIcons() {
    Object.keys(buffers).forEach(key => {
        const el = document.getElementById(`status-${key}`);
        if(buffers[key].trim().length > 0) el.classList.add('staged');
        else el.classList.remove('staged');
    });
}

async function executeBatchDeployment() {
    const pat = document.getElementById('ENTRY_TOKEN').value;
    const repo = document.getElementById('ENTRY_REPO').value;
    const files = Object.keys(buffers).filter(k => buffers[k].trim().length > 0);
    if(files.length === 0) return alert("Nothing staged.");

    document.getElementById('UI_LOG').innerText = "Transmitting...";
    for (const file of files) { await pushFile(pat, repo, file, buffers[file]); }
    document.getElementById('UI_LOG').innerText = "Assets Commissioned.";
}

async function pushFile(pat, repo, path, content) {
    const url = `https://api.github.com/repos/pete-m/${repo}/contents/${path}`;
    let sha = null;
    const g = await fetch(url, {headers:{'Authorization':`token ${pat}`}});
    if(g.ok) { const d = await g.json(); sha = d.sha; }

    return fetch(url, {
        method: 'PUT',
        headers: {'Authorization':`token ${pat}`,'Content-Type':'application/json'},
        body: JSON.stringify({
            message: "PMC Deployment",
            content: btoa(unescape(encodeURIComponent(content))),
            sha: sha
        })
    });
}

function clearCurrentBuffer() {
    document.getElementById('MAIN_TEXT').value = '';
    buffers[currentPath] = '';
    updateStagingIcons();
}

function hardReset() {
    if(confirm("Purge Local Cache?")) { localStorage.clear(); location.reload(); }
}
</script>
</body>
</html>
