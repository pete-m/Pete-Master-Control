<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PMMC_v0.8.2.5</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .pmmc-container { @apply max-w-md mx-auto space-y-4 pb-20; }
        .pmmc-card { @apply p-6 bg-zinc-900 border border-zinc-800 rounded-[2rem] shadow-2xl transition-all; }
        .pmmc-header { @apply p-8 bg-zinc-900 border-b border-zinc-800 flex justify-between items-center rounded-b-[2rem]; }
        
        .log-shell { @apply mx-4 bg-black border border-zinc-800 rounded-xl overflow-hidden transition-all duration-300 cursor-pointer; }
        .log-shell.open { @apply h-40 overflow-y-auto; }
        .log-shell.shut { @apply h-10; }
        .log-line { @apply p-2 font-mono text-[10px] uppercase text-emerald-500 border-b border-zinc-900 last:border-0; }

        #MAINT_MODAL { @apply fixed inset-0 bg-black/95 backdrop-blur-md z-50 hidden flex-col items-center justify-center p-8; }
        
        .pmmc-input { @apply w-full bg-white border border-zinc-800 rounded-xl p-4 text-xs text-black font-mono outline-none focus:border-orange-600 transition-all; }
        .pmmc-textarea { @apply w-full h-80 bg-white border border-zinc-800 rounded-3xl p-5 text-[11px] text-black font-mono outline-none resize-none transition-all; }
        
        .pmmc-btn-main { @apply w-full bg-orange-600 text-black font-black py-5 rounded-2xl uppercase text-[10px] tracking-widest active:scale-95 transition-all shadow-xl; }
        .pmmc-tab { @apply bg-zinc-950 border border-zinc-800 px-4 py-2 rounded-t-xl text-[10px] font-black uppercase text-zinc-600; }
        .pmmc-tab.active { @apply border-t-orange-600 text-orange-500 bg-zinc-900; }
        
        .pmmc-dot { @apply w-2.5 h-2.5 rounded-full bg-zinc-800 transition-all; }
        .pmmc-dot.on { @apply bg-emerald-500 shadow-[0_0_10px_#10b981]; }
        .phase-locked { @apply opacity-25 pointer-events-none; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-300 font-sans p-0">

    <div id="MAINT_MODAL">
        <div class="pmmc-card w-full max-w-xs space-y-4 border-orange-600/40">
            <h3 class="text-orange-500 font-black uppercase italic tracking-[0.2em] text-center text-[10px] mb-4">PMMC Maintenance</h3>
            <button onclick="window.invokeYAML()" class="w-full bg-blue-600 text-white font-black py-4 rounded-xl uppercase text-[10px] tracking-widest shadow-lg active:scale-95 transition-all">Invoke PMMC_Ops</button>
            <button onclick="window.clearRepos()" class="w-full bg-zinc-800 text-orange-500 font-bold py-3 rounded-lg uppercase text-[9px] border border-zinc-700">Clear Logic</button>
            <button onclick="document.getElementById('MAINT_MODAL').style.display='none'" class="w-full text-[10px] text-zinc-600 uppercase font-black py-4">Close Console</button>
        </div>
    </div>

    <div class="pmmc-container">
        <header class="pmmc-header">
            <div>
                <h1 class="text-xl font-black text-orange-600 italic tracking-tighter uppercase">PMMC v0.8.2.5</h1>
                <p class="text-[9px] text-zinc-600 font-bold uppercase tracking-[0.3em]">Ops Engine</p>
            </div>
            <button onclick="document.getElementById('MAINT_MODAL').style.display='flex'" class="text-[10px] font-black text-zinc-500 border border-zinc-800 px-4 py-1.5 rounded-full">MAINT</button>
        </header>

        <div id="LOG_SHELL" onclick="window.toggleLog()" class="log-shell shut">
            <div id="UI_LOG">
                <div class="log-line text-orange-500">[System] PMMC v0.8.2.5 Ready...</div>
            </div>
        </div>

        <div class="px-4 space-y-4">
            <section id="PHASE_0_UI" class="pmmc-card">
                <span class="text-[10px] font-black text-orange-600 uppercase mb-2 block italic">01 // Auth Handshake</span>
                <input type="password" id="ENTRY_TOKEN" oninput="window.silentHandshake()" placeholder="Handshake Token..." class="pmmc-input">
            </section>

            <section id="PHASE_1_UI" class="pmmc-card phase-locked">
                <span class="text-[10px] font-black text-zinc-500 uppercase mb-2 block italic">02 // Repo Factory (Create New)</span>
                <div class="flex gap-2">
                    <input type="text" id="NEW_REPO_NAME" placeholder="New Repo Name..." class="pmmc-input">
                    <button onclick="window.runInit()" class="bg-zinc-800 text-white font-black px-6 rounded-xl text-[10px] uppercase italic">Build</button>
                </div>
            </section>

            <section id="PHASE_2_UI" class="pmmc-card phase-locked space-y-3">
                <span class="text-[10px] font-black text-zinc-500 uppercase mb-2 block italic">03 // Asset Workbench (Target Repo)</span>
                <div class="flex gap-2 mb-4">
                    <input type="text" id="TARGET_REPO_NAME" placeholder="Nominate Repo..." class="pmmc-input">
                    <button onclick="window.updateAssetUI()" class="bg-zinc-800 text-white font-black px-4 rounded-xl text-[10px] uppercase">Sync</button>
                </div>

                <div class="flex justify-between items-center border-t border-zinc-800 pt-4">
                    <div class="flex gap-1 overflow-x-auto no-scrollbar">
                        <button id="tab-index.html" onclick="window.switchTab('tab-index.html')" class="pmmc-tab active">HTML</button>
                        <button id="tab-code.js" onclick="window.switchTab('tab-code.js')" class="pmmc-tab">JS</button>
                        <button id="tab-style.css" onclick="window.switchTab('tab-style.css')" class="pmmc-tab">CSS</button>
                        <button id="tab-manifest.js" onclick="window.switchTab('tab-manifest.js')" class="pmmc-tab">JSON</button>
                        <button id="tab-README.md" onclick="window.switchTab('tab-README.md')" class="pmmc-tab">MD</button>
                    </div>
                    <div class="flex gap-1">
                        <div id="stat-index.html" class="pmmc-dot"></div>
                        <div id="stat-code.js" class="pmmc-dot"></div>
                        <div id="stat-style.css" class="pmmc-dot"></div>
                        <div id="stat-manifest.js" class="pmmc-dot"></div>
                        <div id="stat-README.md" class="pmmc-dot"></div>
                    </div>
                </div>

                <textarea id="MAIN_TEXT" class="pmmc-textarea" placeholder="Asset Content..."></textarea>
                <button onclick="window.runPush()" class="pmmc-btn-main">Commission Asset</button>

                <div id="DEPLOY_LINK_WRAPPER" class="hidden mt-4 p-4 bg-black border border-zinc-800 rounded-2xl text-center">
                    <p class="text-[8px] text-zinc-600 uppercase font-black mb-1">Live Hub URL</p>
                    <a id="DEPLOY_URL" href="#" target="_blank" class="text-orange-500 font-mono text-[10px] break-all hover:underline"></a>
                </div>
            </section>
        </div>
    </div>

    <script src="code.js?v=0.8.2.5"></script>
</body>
</html>
