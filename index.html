<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PMC v0.4.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-zinc-300 p-4 font-sans min-h-screen">
    <div class="max-w-md mx-auto space-y-3 pb-10">
        
        <header class="p-4 bg-zinc-900 border border-zinc-800 rounded-2xl flex justify-between items-center shadow-xl">
            <h1 id="VER_ID" class="text-xl font-black text-zinc-700 uppercase italic tracking-tighter">PMC v0.4.0</h1>
            <button onclick="location.reload(true)" class="text-[9px] font-bold text-red-500 uppercase border border-red-900/30 px-3 py-1 rounded">Reload</button>
        </header>

        <div id="UI_LOG" class="bg-black border border-zinc-900 rounded-xl p-2 text-[10px] font-mono text-zinc-500 text-center h-20 overflow-y-auto flex flex-col-reverse">
            <div class="py-1 italic">[System] Awaiting code.js...</div>
        </div>

        <section class="p-4 bg-zinc-900 border border-zinc-800 rounded-2xl space-y-2">
            <span class="text-[9px] uppercase font-black text-orange-600 tracking-widest px-1">Gateway: PAT</span>
            <div class="flex gap-2">
                <input type="password" id="ENTRY_TOKEN" placeholder="Paste PAT..." class="flex-1 bg-zinc-950 border border-zinc-800 rounded-lg p-3 text-xs outline-none text-orange-500">
                <button id="HANDSHAKE_BTN" class="bg-zinc-800 text-orange-500 font-black px-4 rounded-lg text-[9px] uppercase border border-zinc-700">Verify</button>
            </div>
        </section>

        <section id="PHASE_2_UI" class="space-y-2 opacity-30 pointer-events-none transition-opacity">
            <input type="text" id="ENTRY_REPO" placeholder="user/repo-name" class="w-full bg-zinc-900 border border-zinc-800 rounded-xl p-3 text-xs outline-none text-blue-400 font-mono">
            
            <div class="grid grid-cols-5 gap-1">
                <button id="tab-index.html" class="tab-btn bg-zinc-900 border border-zinc-800 p-2 text-[7px] font-black uppercase">HTML</button>
                <button id="tab-code.js" class="tab-btn bg-zinc-900 border border-zinc-800 p-2 text-[7px] font-black uppercase">JS</button>
                <button id="tab-style.css" class="tab-btn bg-zinc-900 border border-zinc-800 p-2 text-[7px] font-black uppercase">CSS</button>
                <button id="tab-manifest.js" class="tab-btn bg-zinc-900 border border-zinc-800 p-2 text-[7px] font-black uppercase">JSON</button>
                <button id="tab-README.md" class="tab-btn bg-zinc-900 border border-zinc-800 p-2 text-[7px] font-black uppercase">MD</button>
            </div>
            
            <textarea id="MAIN_TEXT" class="w-full h-64 bg-zinc-900 border border-zinc-800 rounded-xl p-4 text-[10px] font-mono outline-none resize-none" placeholder="Paste code..."></textarea>
            
            <button id="PUSH_TRIGGER" class="w-full bg-zinc-800 border border-zinc-700 text-zinc-500 font-bold py-3 rounded-lg uppercase text-[9px] mt-2 active:bg-orange-600">Commission Batch</button>
        </section>
    </div>

    <script src="./code.js"></script>
</body>
</html>
